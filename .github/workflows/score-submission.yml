name: Score submission

# Scores a pull request that adds or changes submissions/<name>/ against the
# base snapshot and posts the result as a comment. It runs the Python scorer
# only: no Lean toolchain, no Mathlib, no compilation.

on:
  pull_request:
    paths:
      - "submissions/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: score-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      # The scorer reads the index and graph files, not the 90,000 Lean files
      # of the snapshot, so only those are checked out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /benchmark/
            /submissions/
            /MANIFEST.json
            /seeds.json
            /envs/*/index-*.jsonl
            /envs/*/graph-*.jsonl

      - name: Score
        id: score
        run: |
          set -euo pipefail
          # HEAD is the merge of the pull request into its base, HEAD^1 the base.
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          if grep -qvE '^submissions/[^_/][^/]*/' "$RUNNER_TEMP/changed.txt"; then
            {
              echo "This pull request changes files outside \`submissions/<name>/\`, so it is not scored as a submission:"
              echo
              grep -vE '^submissions/[^_/][^/]*/' "$RUNNER_TEMP/changed.txt" | head -20 | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          failed=no
          : > "$RUNNER_TEMP/comment.md"
          for dir in $(grep -oE '^submissions/[^/]+' "$RUNNER_TEMP/changed.txt" | sort -u); do
            [ -d "$dir" ] || continue
            if ! python3 benchmark/or_bench.py score --markdown --submission "$dir" \
                > "$RUNNER_TEMP/out.md" 2> "$RUNNER_TEMP/err.txt"; then
              failed=yes
              if [ ! -s "$RUNNER_TEMP/out.md" ]; then
                { echo "### Graph-refinement score: \`$dir\`"; echo; echo '```'; cat "$RUNNER_TEMP/err.txt"; echo '```'; } \
                  > "$RUNNER_TEMP/out.md"
              fi
            fi
            { cat "$RUNNER_TEMP/out.md"; echo; } >> "$RUNNER_TEMP/comment.md"
          done
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/comment.md" ]; then echo "comment=yes" >> "$GITHUB_OUTPUT"; fi

      # One comment per pull request, updated on every push. A pull request from
      # a fork has a read-only token: the score is then in the job summary only.
      - name: Comment
        if: steps.score.outputs.comment == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --body-file "$RUNNER_TEMP/comment.md" \
            || gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md" \
            || echo "::warning::Could not comment on the pull request; the score is in the job summary."

      - name: Fail if the submission has problems
        if: steps.score.outputs.failed == 'yes'
        run: |
          echo "::error::The submission has problems; see the comment or the job summary."
          exit 1
